name: SQL parameter regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sql-parameters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Exercise the real read-only SQLite subprocess
        run: npm run test:sql
      - name: Check patch whitespace
        run: git show --format= --check HEAD
