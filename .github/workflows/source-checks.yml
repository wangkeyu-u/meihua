name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci --ignore-scripts
      - name: Check Electron and build script syntax
        run: npm run check:source
      - name: Type-check and build frontend
        run: npm run build
